name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g. v0.1.0); creates a GitHub Release at the selected commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build Debug APKs
        if: env.RELEASE_BUILD == 'false'
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: env.RELEASE_BUILD == 'false'
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Configure required release signing
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 repository secret}"
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing SIGNING_KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD repository secret}"
          mkdir -p signing
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Test and build signed Release APKs
        if: env.RELEASE_BUILD == 'true'
        run: ./gradlew --no-configuration-cache -PsplitReleaseApks=true :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and collect signed APKs
        if: env.RELEASE_BUILD == 'true'
        run: |
          set -euo pipefail
          mkdir -p ../dist
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for abi in armeabi-v7a arm64-v8a; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            test -f "$apk" || { echo "::error::Missing $apk"; exit 1; }
            "$APKSIGNER" verify --verbose "$apk"
            if [ "$abi" = "armeabi-v7a" ]; then
              output="CodeTrans-armv7-release.apk"
            else
              output="CodeTrans-arm64-release.apk"
            fi
            cp "$apk" "../dist/$output"
          done
          test "$(find ../dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2

      - uses: actions/upload-artifact@v7
        if: env.RELEASE_BUILD == 'true'
        with:
          name: signed-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LLVM_MINGW_VERSION: '20261020'
      NINJA_VERSION: v1.13.2
    steps:
      - uses: actions/checkout@v7

      - name: Install llvm-mingw (msvcrt) and Ninja
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-msvcrt-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.zip"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/llvm-mingw.zip" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/ninja.zip" \
            "https://github.com/ninja-build/ninja/releases/download/${NINJA_VERSION}/ninja-win.zip"
          mkdir -p "$RUNNER_TEMP/ninja"
          7z x -y -o"$RUNNER_TEMP/ninja" "$RUNNER_TEMP/ninja.zip" > /dev/null
          echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build and test (x86)
        run: windows/build.sh x86

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/build-x86/CodeTrans.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a version such as v0.1.0"
            exit 1
          fi
          ref="refs/tags/$tag"
          tagged_sha="$(git ls-remote --tags --sort=refname origin "$ref" "$ref^{}" | tail -n 1 | cut -f 1)"
          if [[ -n "$tagged_sha" && "$tagged_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag already points to a different commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: signed-android
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - name: Publish Windows EXE and signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -s dist/CodeTrans.exe
          test -s dist/CodeTrans-armv7-release.apk
          test -s dist/CodeTrans-arm64-release.apk
          gh release create "$RELEASE_TAG" \
            dist/CodeTrans.exe \
            dist/CodeTrans-armv7-release.apk \
            dist/CodeTrans-arm64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeTrans $RELEASE_TAG" \
            --generate-notes
