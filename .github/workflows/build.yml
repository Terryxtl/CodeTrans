name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version (e.g. v0.1.0); creates a GitHub Release at the selected commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Signed Android APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Configure required release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 repository secret}"
          : "${STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing SIGNING_KEY_ALIAS repository secret}"
          : "${KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD repository secret}"
          mkdir -p signing
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Test and build signed Release APKs
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and collect signed APKs
        run: |
          set -euo pipefail
          mkdir -p ../dist
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for abi in armeabi-v7a arm64-v8a; do
            apk="app/build/outputs/apk/release/app-${abi}-release.apk"
            test -f "$apk" || { echo "::error::Missing $apk"; exit 1; }
            "$APKSIGNER" verify --verbose "$apk"
            if [ "$abi" = "armeabi-v7a" ]; then
              output="CodeTrans-armv7-release.apk"
            else
              output="CodeTrans-arm64-release.apk"
            fi
            cp "$apk" "../dist/$output"
          done
          test "$(find ../dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2

      - uses: actions/upload-artifact@v7
        with:
          name: signed-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  release:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a version such as v0.1.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: signed-android
          path: dist

      - name: Publish exactly two signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/CodeTrans-armv7-release.apk
          test -f dist/CodeTrans-arm64-release.apk
          gh release create "$RELEASE_TAG" \
            dist/CodeTrans-armv7-release.apk \
            dist/CodeTrans-arm64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CodeTrans $RELEASE_TAG" \
            --generate-notes
