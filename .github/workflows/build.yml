name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "ndk;30.0.14904198" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Configure release signing
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing/signing.properties

      - name: Unit tests and build
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/CodeTrans-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist/CodeTrans.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../dist/CodeTrans-unsigned.apk
          fi
          cp app/build/outputs/mapping/release/mapping.txt ../dist/mapping.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LLVM_MINGW_VERSION: '20261020'
      NINJA_VERSION: v1.13.2
    steps:
      - uses: actions/checkout@v7

      - name: Install llvm-mingw (msvcrt) and Ninja
        run: |
          name="llvm-mingw-${LLVM_MINGW_VERSION}-msvcrt-x86_64"
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.zip"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/llvm-mingw.zip" > /dev/null
          curl -fsSL -o "$RUNNER_TEMP/ninja.zip" \
            "https://github.com/ninja-build/ninja/releases/download/${NINJA_VERSION}/ninja-win.zip"
          mkdir -p "$RUNNER_TEMP/ninja"
          7z x -y -o"$RUNNER_TEMP/ninja" "$RUNNER_TEMP/ninja.zip" > /dev/null
          # Prepend so these win over any other MinGW / Ninja on the runner's PATH.
          echo "$RUNNER_TEMP/ninja" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"

      - name: Build and test (x86)
        run: windows/build.sh x86

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/build-x86/CodeTrans.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f dist/mapping.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "CodeTrans $GITHUB_REF_NAME" --generate-notes
